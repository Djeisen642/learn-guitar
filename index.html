<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordgrip — learn guitar chords on your phone</title>
<meta name="description" content="A mobile-first guitar chord trainer: chord diagrams you can hear, a staged learning path, and the one-minute-changes drill.">
<meta name="theme-color" content="#12100e">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<!-- iOS ignores SVG here, so the home-screen icon must be a PNG. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chordgrip">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1 class="brand"><span class="brand-mark" aria-hidden="true">♪</span> Chordgrip</h1>
  <div class="streak" id="streak" title="Consecutive days practiced"></div>
</header>

<div class="rotate-tip" id="rotate-tip" role="status" hidden>
  <p class="rotate-lead"><strong>Turn your phone upright.</strong> Chordgrip is laid out for portrait —
    lock your rotation so the screen can't flip while you're playing.</p>
  <p class="rotate-how">iPhone: swipe into Control Center and tap the padlock arrow.
    Android: open Quick Settings and turn off auto-rotate.</p>
  <button type="button" class="btn btn-small" id="rotate-dismiss">Got it</button>
</div>

<main id="view" tabindex="-1"></main>

<p class="build" id="build" hidden></p>

<nav class="tabbar" aria-label="Sections">
  <a href="#/learn"    data-tab="learn"><span class="ti" aria-hidden="true">▤</span>Learn</a>
  <a href="#/chords"   data-tab="chords"><span class="ti" aria-hidden="true">⊞</span>Chords</a>
  <a href="#/play"     data-tab="play"><span class="ti ti-strings" aria-hidden="true">|||</span>Play</a>
  <a href="#/practice" data-tab="practice"><span class="ti" aria-hidden="true">◔</span>Practice</a>
  <a href="#/songs"    data-tab="songs"><span class="ti" aria-hidden="true">♫</span>Songs</a>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>

<script type="module" src="js/app.js"></script>
</body>
</html>
